version: '3'

vars:
  APP_NAME: tusk
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Build Tusk for macOS
    cmds:
      - task: darwin:build
  package:
    summary: Build an ad-hoc signed macOS app bundle
    cmds:
      - task: darwin:package
  run:
    cmds:
      - task: darwin:run
  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
